<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Log</title>
<style>
:root{
  --bg:#000;--card:#161618;--card2:#232326;--line:#2c2c30;
  --text:#f5f5f7;--muted:#8e8e93;
  --green:#30d158;--red:#ff453a;--blue:#0a84ff;--purple:#bf5af2;--orange:#ff9f0a;--yellow:#ffd60a;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Helvetica Neue",Arial,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-top) + 12px) max(16px,env(safe-area-inset-right)) calc(var(--safe-bottom) + 110px) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit;touch-action:manipulation}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=date]{min-height:44px}
textarea{min-height:90px;resize:vertical}
select{-webkit-appearance:none;appearance:none}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:40px;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:19px;font-weight:700;text-align:center;flex:1;min-width:0}
.sync-line{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
h1{font-size:28px;font-weight:800;margin:6px 0 2px}
h2{font-weight:700;margin:20px 4px 8px;color:var(--muted);letter-spacing:.5px;font-size:13px}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ex-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ex-item:last-child{border-bottom:0}
.ex-name{font-weight:600;font-size:16px}
.ex-meta{color:var(--muted);font-size:13px;margin-top:2px}
.badge{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.green{background:rgba(48,209,88,.18);color:var(--green)}
.badge.strong{background:var(--green);color:#000}
.badge.red{background:rgba(255,69,58,.18);color:var(--red)}
.primary{display:flex;align-items:center;justify-content:center;width:100%;padding:16px;border-radius:16px;background:var(--green);color:#000;font-weight:700;font-size:18px;text-align:center}
.primary.blue{background:var(--blue);color:#fff}
.primary.red{background:var(--red);color:#fff}
.secondary{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border-radius:14px;background:var(--card2);color:var(--text);font-weight:600;font-size:15px;text-align:center}
.secondary:disabled{opacity:.4}
.danger{color:var(--red)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(var(--safe-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);max-width:560px;margin:0 auto;z-index:5}
.bottom .row{gap:8px}
.row>.primary,.row>.secondary{flex:1;width:auto}
.skip{flex:0 0 auto;padding:16px 13px;border-radius:16px;background:var(--card2);font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap}
.skip:disabled{opacity:.3}
.bottom .primary{font-size:17px;padding:16px 8px;white-space:nowrap}
.primary.off{background:var(--card2);color:var(--muted)}
.primary .cnt{font-size:13px;font-weight:600;margin-left:6px;opacity:.8}
.small{font-size:13px}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--card2);color:var(--text)}
.seg.sm button{padding:6px 0;font-size:13px}
.tabs{display:flex;gap:5px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:12px;background:var(--card);font-weight:700;color:var(--muted);font-size:14px}
.tab.on{background:var(--text);color:#000}
.label{font-size:13px;color:var(--muted);margin:12px 0 6px;display:block}
.field{margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 4px}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--card2);font-size:28px;font-weight:600;text-align:center}
.stepper button:disabled{opacity:.3}
.stepper .w{font-size:46px;font-weight:800;min-width:130px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.stepper .w small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.stepper .step{font-size:11px;color:var(--muted);display:block;margin-top:2px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.plate{display:inline-block;padding:6px 12px;border-radius:10px;background:var(--card2);color:var(--muted);font-size:13px;font-weight:700;border:1px solid var(--line)}
.plate.on{background:rgba(48,209,88,.18);color:var(--green);border-color:rgba(48,209,88,.5)}
.prow2{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.prow2:last-child{border-bottom:0}
.prow2 .ctl{display:flex;align-items:center;gap:6px}
.prow2 .ctl button{width:36px;height:36px;border-radius:10px;background:var(--card2);font-size:20px;font-weight:600;text-align:center}
.prow2 .ctl button:disabled{opacity:.25}
.prow2 .ctl b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.suggest{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;font-weight:700;font-size:14px}
.suggest.up{background:rgba(48,209,88,.16);color:var(--green)}
.suggest.strong{background:var(--green);color:#000}
.suggest.down{background:rgba(255,69,58,.16);color:var(--red)}
.suggest.keep{background:var(--card2);color:var(--muted)}
.rpe-bar{display:flex;gap:4px;margin-top:12px}
.rpe-bar button{flex:1;height:46px;border-radius:10px;font-weight:800;font-size:15px;color:rgba(255,255,255,.8);transition:transform .12s;opacity:.5;text-align:center}
.rpe-bar button.on{opacity:1;transform:scaleY(1.2);color:#fff;box-shadow:0 0 0 2px #fff inset}
.rpe-bar.sm button{height:38px;font-size:13px}
.rpe-desc{min-height:92px;margin-top:4px}
.rpe-desc .t{font-size:20px;font-weight:800}
.rpe-desc .code{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:3px}
.rpe-desc .d{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.45}
.rpe-desc .next{font-size:14px;font-weight:700;margin-top:6px}
/* 組數：黃圈 = 等緊做、綠圈 = 做緊、綠底 = 做完
   圈用 SVG（r=25，圓周 157.1）：外層轉（有速度曲線）、條弧長短會變；全部跟同一條時間線，重畫都唔會跳 */
#setsCard{position:relative}
.sets{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:20px 0 10px}
.sets button{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card2);font-weight:800;color:var(--muted);font-size:16px;text-align:center;-webkit-tap-highlight-color:transparent}
.sets .n{position:relative;z-index:1;display:inline-block}
.sets .rw{position:absolute;left:-7px;top:-7px;width:56px;height:56px;pointer-events:none;transition:transform .32s cubic-bezier(.3,1.6,.5,1),opacity .28s}
.sets .rg{display:block;width:56px;height:56px;overflow:visible}
.sets .rg circle{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round}
.sets .rg .tr{opacity:.15}
/* 等緊：一直向前轉（唔會慢到停）；條弧個頭向前伸長，然後條尾追上嚟縮短，頭永遠唔會倒後行
   一個 cycle：圈轉 252°，弧頭自己行 108°（47 單位），加埋啱啱 360°，所以 cycle 頭尾接得上、冇回帶 */
.sets .wait{color:var(--yellow)}
.sets .wait .rg{animation:rotW 2.4s cubic-bezier(.5,.08,.5,.92) var(--pr,0s) infinite}
.sets .wait .ar{animation:arcBreath 2.4s cubic-bezier(.45,0,.55,1) var(--pr,0s) infinite}
.sets .wait .n{animation:nb 2.4s ease-in-out var(--pr,0s) infinite}
.sets .wait.appear .rw{animation:appear .6s .32s cubic-bezier(.3,1.7,.5,1) both}
.sets .wait.soon .rg{animation-duration:1.2s;filter:drop-shadow(0 0 4px rgba(255,214,10,.85))}
.sets .wait.soon .ar,.sets .wait.soon .n{animation-duration:1.2s}
.sets .wait.catch .rw{transform:scale(1.28);opacity:.25}
/* 做緊：頭追尾咁轉，快慢交替 */
.sets .doing{color:var(--green);animation:halo 1.5s ease-in-out var(--pd,0s) infinite}
.sets .doing .rg{animation:rot 2s cubic-bezier(.4,.12,.6,.88) var(--pr,0s) infinite;filter:drop-shadow(0 0 3px rgba(48,209,88,.8))}
.sets .doing .ar{animation:chase 1.5s cubic-bezier(.45,0,.25,1) var(--pd,0s) infinite}
.sets .doing.land{animation:none}
.sets .doing.land .rw{animation:squash .56s cubic-bezier(.25,.9,.35,1) both}
.sets .doing.land .ar{animation:unwrap .56s cubic-bezier(.6,0,.3,1) both}
.sets .doing.land .n{animation:nbounce .5s cubic-bezier(.3,1.8,.5,1) both}
.sets .doing.land::after,.sets .justdone::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2.5px solid var(--green);pointer-events:none;animation:ripple .62s cubic-bezier(.2,.7,.3,1) both}
/* 做完：綠圈收埋入去，綠色由中間漲出嚟 */
.sets .done{background:var(--green);color:#000}
.sets .justdone{background:var(--card2);color:var(--green)}
.sets .justdone::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:fill .5s .2s cubic-bezier(.3,1.6,.5,1) both}
.sets .justdone::after{animation-delay:.26s}
.sets .justdone .n{animation:ndone .5s .16s cubic-bezier(.3,1.6,.5,1) both}
.sets .justdone .rw{animation:collapse .4s cubic-bezier(.5,0,.8,.4) both}
@keyframes rot{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
@keyframes rotW{from{transform:rotate(-90deg)}to{transform:rotate(162deg)}}
@keyframes arcBreath{0%{stroke-dasharray:25.1 132;stroke-dashoffset:0}50%{stroke-dasharray:72 85.1;stroke-dashoffset:0}100%{stroke-dasharray:25.1 132;stroke-dashoffset:-47}}
@keyframes chase{0%{stroke-dasharray:94.2 62.9;stroke-dashoffset:0}50%{stroke-dasharray:12.6 144.5;stroke-dashoffset:-110}100%{stroke-dasharray:94.2 62.9;stroke-dashoffset:-157.1}}
@keyframes unwrap{0%,28%{stroke-dasharray:157.1 0;stroke-dashoffset:0}100%{stroke-dasharray:94.2 62.9;stroke-dashoffset:0}}
@keyframes squash{0%{transform:scale(1.18,.78)}32%{transform:scale(.88,1.12)}62%{transform:scale(1.05,.96)}100%{transform:none}}
@keyframes nbounce{0%{transform:scale(.55)}100%{transform:none}}
@keyframes nb{0%,100%{transform:none}50%{transform:scale(1.1)}}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}50%{box-shadow:0 0 18px 2px rgba(48,209,88,.34)}}
@keyframes appear{0%{transform:scale(.25);opacity:0}100%{transform:none;opacity:1}}
@keyframes ripple{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.95);opacity:0}}
@keyframes fill{0%{transform:scale(0)}100%{transform:none}}
@keyframes ndone{0%{color:var(--green);transform:none}40%{transform:scale(.6)}100%{color:#000;transform:none}}
@keyframes collapse{0%{transform:none;opacity:1}28%{transform:scale(1.12);opacity:1}100%{transform:scale(.5);opacity:0}}
.timer{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;min-height:58px;line-height:58px;transform-origin:50% 55%}
.timer.ready{color:var(--yellow);font-size:38px;animation:readyB 2.4s ease-in-out infinite}
.timer.doing{color:var(--green)}
.timer.warn{color:var(--orange)}
.timer.done{color:var(--green)}
.timer.go{color:var(--green)}
.timer.enter{animation:tEnter .46s cubic-bezier(.3,1.5,.5,1)}
.timer.beat{animation:tBeat .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes readyB{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes tEnter{0%{transform:translateY(16px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes tBeat{0%{transform:scale(1.24)}100%{transform:none}}
.tcap{text-align:center;color:var(--muted);font-size:14px;font-weight:600;min-height:20px;transition:color .3s}
.tcap.hot{color:var(--orange)}
.restbar{height:4px;border-radius:2px;background:var(--card2);overflow:hidden;margin:10px 18% 0;opacity:0;transition:opacity .2s}
.restbar.on{opacity:1}
.restbar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .25s linear,background .4s}
.restbar.hot i{background:var(--orange)}
.setbtn{display:flex;align-items:center;justify-content:center;width:100%;padding:15px 10px;border-radius:14px;font-weight:800;font-size:16px;margin-top:14px;text-align:center;transition:background .25s,color .25s,opacity .25s}
.setbtn.go{background:var(--yellow);color:#000}
.setbtn.go.early{background:rgba(255,214,10,.13);color:var(--yellow)}
.setbtn.fin{background:var(--green);color:#000}
.tctl{display:flex;gap:6px;margin-top:8px}
.tctl button{flex:1;padding:11px 0;border-radius:12px;background:var(--card2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* 動作之間休息頁 */
.brkwrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 0}
.brk-ring{position:relative;width:230px;height:230px;margin:10px auto 4px}
.brk-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.brk-ring .bg{fill:none;stroke:var(--card2);stroke-width:9}
.brk-ring .fg{fill:none;stroke:var(--yellow);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .4s}
.brk-ring.hot .fg{stroke:var(--orange)}
.brk-ring.zero .fg{stroke:var(--muted)}
.brk-ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brk-ring .timer{font-size:56px;min-height:64px;line-height:64px}
.brk-ring .tcap{font-size:13px;padding:0 26px}
.brk-next{width:100%}
.brk-next .lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.brk-next .nm{font-size:22px;font-weight:800;margin-top:2px}
.tctl.brk button{padding:13px 0;font-size:14px}
/* 飛行中嘅圈：放喺組數卡入面（absolute），碌畫面都會跟住走 */
.flyring{position:absolute;z-index:3;border-radius:50%;border:4px solid var(--green);box-shadow:0 0 20px rgba(48,209,88,.7),inset 0 0 12px rgba(48,209,88,.4);pointer-events:none;will-change:transform,opacity;transform-origin:50% 50%}
.card.pulse{animation:pulse 1.1s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,0)}40%{box-shadow:0 0 0 3px rgba(255,214,10,.85)}}
.last{text-align:right}
.last .n{font-size:26px;font-weight:800;line-height:1}
.last .n small{font-size:13px;color:var(--muted);font-weight:600}
.notes{white-space:pre-wrap;color:var(--muted);font-size:14px;line-height:1.5}
.progress-line{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-bottom:10px}
.progress-line i{display:block;height:100%;background:var(--green)}
/* chart */
.chart-wrap{background:var(--card);border-radius:18px;padding:12px 10px 8px}
.rangehead{display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px;margin:8px 0 2px}
.rangehead .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.rangehead .v{font-size:24px;font-weight:800;line-height:1.1}
.rangehead .v small{font-size:14px;color:var(--muted);font-weight:600}
.rangehead .d{font-size:12px;color:var(--muted);margin-top:2px}
.chartbox{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.chartbox.drag{cursor:grabbing}
svg.chart{width:100%;height:auto;display:block}
.tooltip{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 4px 0;font-size:14px;min-height:62px}
.legend{display:flex;gap:6px;align-items:center;margin:10px 4px 0;font-size:11px;color:var(--muted)}
.legend .g{flex:1;height:8px;border-radius:4px}
.hist{width:100%;padding:11px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:14px;text-align:left}
.hist:last-child{border-bottom:0}
.hist .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.chev{color:var(--muted);font-size:18px;margin-left:2px}
.prow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.prow:last-child{border-bottom:0}
.rpe-num{min-width:40px;text-align:center;font-weight:800;font-size:15px}
.mini{width:32px;height:32px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);flex:0 0 auto}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.toggle:last-child{border-bottom:0}
.switch{width:50px;height:30px;border-radius:15px;background:var(--card2);position:relative;transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{left:23px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-bottom) + 110px);background:var(--text);color:#000;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;width:max-content;text-align:center}
.toast.show{opacity:1}
.big{font-size:60px;text-align:center;margin:30px 0 10px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.choice{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:var(--card);margin-bottom:10px}
.choice b{display:block;font-size:17px}
.choice span{color:var(--muted);font-size:14px}
.day-chip{display:inline-block;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--muted);font-size:11px;margin-right:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(var(--safe-bottom) + 18px);max-height:92vh;overflow:auto}
.mmsg{font-size:17px;font-weight:600;line-height:1.45;padding:4px 2px}
.help{font-size:13px;color:var(--muted);line-height:1.55}
.help ol{padding-left:20px;margin:6px 0}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
@keyframes flash{0%{box-shadow:inset 0 0 0 0 rgba(48,209,88,0)}30%{box-shadow:inset 0 0 0 9999px rgba(48,209,88,.28)}100%{box-shadow:inset 0 0 0 0 rgba(48,209,88,0)}}
body.flash{animation:flash .9s ease 2}
@keyframes flash2{0%{box-shadow:inset 0 0 0 0 rgba(255,159,10,0)}30%{box-shadow:inset 0 0 0 9999px rgba(255,159,10,.2)}100%{box-shadow:inset 0 0 0 0 rgba(255,159,10,0)}}
body.flash2{animation:flash2 .7s ease 1}
.pr{color:#ffd60a}
/* iPad／打橫：兩欄 */
@media (min-width:800px){
  #app{max-width:1000px}
  .bottom{max-width:1000px}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .wcol2{margin-top:12px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  .rpe-bar button{height:54px}
}
.kind-tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted)}
/* 提醒 */
.memo{border:1px solid rgba(255,214,10,.35);background:rgba(255,214,10,.07)}

.warnc{border:1px solid rgba(255,159,10,.4);background:rgba(255,159,10,.08)}

/* 本週 */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin:10px 0 2px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px}

.wkd.istoday .lb{color:var(--text)}
.chip{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--card2);color:var(--muted)}
.chip.done{background:var(--green);color:#000}
.chip.made{background:linear-gradient(135deg,var(--green),#64d2ff);color:#000}
.chip.miss{background:transparent;border:2px dashed rgba(255,69,58,.65);color:var(--red);font-size:13px}
.chip.today{background:transparent;border:2px solid var(--yellow);color:var(--yellow);font-size:13px;animation:breathe 2s ease-in-out infinite}
.chip.todo{background:transparent;border:2px solid var(--line)}
.chip.rest{width:7px;height:7px;margin:13.5px 0;background:var(--line)}
.chip.extra{width:12px;height:12px;margin:11px 0;background:var(--green)}
.chip.pop{animation:chipPop .7s 1.15s cubic-bezier(.3,1.7,.5,1) both}
.chip.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--green);animation:ringOut .9s 1.3s ease-out both}
.wkd .sb{font-size:10px;color:var(--muted);min-height:13px;white-space:nowrap;font-weight:600}
@keyframes breathe{50%{box-shadow:0 0 0 4px rgba(255,214,10,.18)}}
@keyframes chipPop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes ringOut{0%{transform:scale(1);opacity:1}100%{transform:scale(2.2);opacity:0}}
.wkmsg{font-size:14px;font-weight:600;margin-top:8px;line-height:1.45}

/* 完成畫面 */

.celmsg.miss .ct span{display:inline-block;animation:flex 1s 1.6s ease-in-out 2}
@keyframes flex{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(10deg) scale(1.2)}}

@media (prefers-reduced-motion:reduce){.sets *,.sets button,.sets button::before,.sets button::after,.timer,.chip.today{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<div id="modal" class="modal" onclick="closeModal(false)"></div>
<div id="toast" class="toast"></div>
<script>
/* ====================== 常數 ====================== */
const APP_VER='v6.4';
const LS_PREFS='gymlog_prefs_v1';
const LS='gymlog_v2', LS_SESSION='gymlog_session_v2', LS_SYNC='gymlog_sync_v1';
const DAYS=['日','一','二','三','四','五','六'];
const DAY_ORDER=['1','2','3','4','5','6','0'];
const CATS={back:'背',biceps:'二頭',chest:'胸',triceps:'三頭',shoulders:'肩',legs:'腿',abs:'腹',forearm:'前臂',other:'其他'};
const KINDS={notch:'固定檔位',plates:'加配重片',stack:'配重塊',body:'自重'};
const KIND_HELP={
  notch:'一排固定重量嘅器材，例如啞鈴架。輸入所有檔位，建議加重會直接跳落一檔。',
  plates:'用配重片砌重量，例如槓鈴（每邊各放）或者手持槓鈴片。輸入基本重量（槓本身）同你有嘅配重片數量，app 會幫你計每邊放咩片。',
  stack:'插銷式配重塊，例如龍門架／繩索機。輸入最低、最高同每格重量；有快拆加重片就加落「加重片」度。',
  body:'冇重量，只記錄難度。'};

/* 難度 1–10：頭加「太輕鬆」、中間加「開始有挑戰」、尾加「力竭」，其餘對返舊 y / n 代號 */
const RPE_COLORS=[null,'#3b82f6','#0ea5e9','#14b8a6','#22c55e','#84cc16','#eab308','#f97316','#ef4444','#d946ef','#9333ea'];
const RPE=[null,
 {t:'太輕鬆',     code:'',     d:'完全冇感覺，好似熱身咁，4 組做完都唔覺攰。'},
 {t:'好輕鬆',     code:'yyy',  d:'好輕鬆，明顯可以再重好多。'},
 {t:'輕鬆',       code:'yy',   d:'輕鬆，最後一組都仲有好多力。'},
 {t:'OK',         code:'y',    d:'有訓練感但唔辛苦，可以試吓加少少。'},
 {t:'開始有挑戰', code:'',     d:'最後一組最後幾下開始吃力，但動作仲係好穩。'},
 {t:'剛剛好',     code:'空白', d:'有少少難，最後一兩下要出力但全部做得晒 — 剛剛好 ahhh。'},
 {t:'有啲頂唔順', code:'n',    d:'最後一組最後 1–4 下唔係好掂，要少少借力或者幫手。'},
 {t:'好辛苦',     code:'nn',   d:'最後一組最後 5–8 下已經 dying，勉強先完成。'},
 {t:'太重',       code:'nnn',  d:'最後一組大約只做到 3 下左右。'},
 {t:'力竭',       code:'',     d:'幾組都做唔夠，第二、三組已經跌晒次數，完全冇力。'},
];

/* ====================== 建議算法（單位 = 器材「一檔」：繩索 5、槓鈴每邊 2.5、啞鈴跳一格；0.5 檔 = 繩索快拆 2.5）
   r0 = 今次難度, r1 = 上次, sameW = 上次同今次同一重量 */
function ruleUnits(r0,r1,sameW){
  const has=r1!=null; let u=0, why='';
  switch(r0){
    case 1: u=1.5; why='太輕鬆'; break;
    case 2: u=1;   why='好輕鬆'; break;
    case 3: if(has&&r1<=3){u=1.5;why='連續兩次輕鬆';}else{u=1;why='輕鬆';} break;
    case 4: u=0.5; why='OK，微加'; break;
    case 5: if(has&&r1<=5){u=0.5;why='連續兩次唔算難';}else{u=0;why='維持多一次再加';} break;
    case 6: u=0; why='剛剛好，維持'; break;
    case 7: u=0; why='維持，練到穩先加'; break;
    case 8: if(has&&r1>=8){u=-0.5;why='連續兩次好辛苦';}else{u=0;why='維持再試一次';} break;
    case 9: if(has&&r1>=9){u=-1;why='連續兩次太重';}else{u=-0.5;why='太重，減少少';} break;
    case 10: u=-1; why='力竭'; break;
  }
  // 成長趨勢：同一重量，比上次輕鬆咗 → 每輕鬆 1 級多加 0.5 檔（最多 +1）
  if(has&&sameW&&r0<=6&&r1-r0>=1){const b=Math.min(r0>=6?0.5:1,(r1-r0)*0.5);why=`同一重量比上次輕鬆 ${r1-r0} 級`+(u>0?'，'+why:'');u+=b;}
  u=Math.max(-1,Math.min(1.5,u));
  return [u,why];
}
/* 用成個歷史計下次：r0/w0 = 今次難度／重量，prev = 之前嘅紀錄（新→舊），now = 今次嘅時間 */
function planNext(r0,w0,prev,now){
  const l1=prev[0]; const same=l1&&Math.abs(l1.weight-w0)<1e-9;
  let [u,why]=ruleUnits(r0,l1?l1.rpe:null,!!same); let target=null;
  const sw=[r0]; for(const l of prev){ if(Math.abs(l.weight-w0)>1e-9) break; sw.push(l.rpe); }  // 連續幾次都係呢個重量
  if(sw.length>=3&&sw.slice(0,3).every(r=>r>=6&&r<=7)&&u<0.5){u=0.5;why='連續三次都係剛剛好，試吓微加';}
  if(sw.length>=3&&sw.slice(0,3).every(r=>r>=8)){u=-1;why='連續三次好辛苦，減重重新儲力';}
  if(l1&&w0<l1.weight-1e-9&&u>0.5){u=0.5;why='啱啱減完重量，慢慢加返';}
  if(l1&&w0>l1.weight+1e-9&&r0>=9){target=l1.weight;u=-0.5;why='加重後太辛苦，返返上次重量';}
  if(l1&&now){ const gap=Math.round((now-l1.ts)/86400000);
    if(gap>=42&&u>-0.5){u=-0.5;why=`${gap} 日冇練，先減少少`;} else if(gap>=21&&u>0){u=0;why=`${gap} 日冇練，先維持`;} }
  u=Math.max(-1,Math.min(1.5,u));
  return {u,why,target};
}
function tierOf(u){return u>=1.5?'強烈加重':u>=1?'加重':u>0?'微加':u===0?'維持':u>-1?'微減':'減重';}

/* ====================== 器材 ====================== */
function defaultEquip(){
  const inv=[{w:20,n:2},{w:10,n:2},{w:5,n:2},{w:2.5,n:4}];
  return {
    cable:{id:'cable',name:'繩索',kind:'stack',min:5,max:70,step:5,addons:[{w:2.5,name:'快拆片'}],mt:0},
    barbell:{id:'barbell',name:'槓鈴',kind:'plates',base:10,perSide:true,plates:inv.map(p=>({...p})),mt:0},
    dumbbell:{id:'dumbbell',name:'啞鈴',kind:'notch',perHand:true,notches:[3,4.5,5,6.5,7,8.5,9,10.5,11,12.5,13,14.5,16.5,18.5,20.5,22.7],mt:0},
    plate:{id:'plate',name:'槓鈴片（手持）',kind:'plates',base:0,perSide:false,plates:inv.map(p=>({...p})),mt:0},
    bodyweight:{id:'bodyweight',name:'徒手',kind:'body',mt:0},
  };
}
const r2=x=>Math.round(x*100)/100;
const _achCache={};
function equipOf(id){return S.equip[id]||{id,name:'（已刪器材）',kind:'missing'};}
// 所有可以砌到嘅重量（plates perSide = 每邊；stack = 配重 + 加重片）
function achievable(eq){
  const key=JSON.stringify(eq); if(_achCache[key]) return _achCache[key];
  let set=new Set();
  if(eq.kind==='notch') (eq.notches||[]).forEach(n=>set.add(r2(n)));
  else if(eq.kind==='stack'){
    const adds=subsetSums((eq.addons||[]).slice(0,6).map(a=>({w:a.w,n:1})));
    const step=Math.max(0.25,+eq.step||5), mn=Math.max(0,+eq.min||0), mx=Math.min(mn+step*400,Math.max(mn,+eq.max||mn));
    for(let k=0,b=mn;b<=mx+1e-9;k++,b=r2(mn+step*k)) adds.forEach(a=>set.add(r2(b+a)));
  } else if(eq.kind==='plates'){
    const inv=(eq.plates||[]).map(p=>({w:p.w,n:eq.perSide?Math.floor(p.n/2):p.n}));
    subsetSums(inv).forEach(v=>set.add(r2(v)));
  } else set.add(0);
  const arr=[...set].sort((a,b)=>a-b); if(!arr.length) arr.push(0);
  return _achCache[key]=arr;
}
function subsetSums(inv){ let s=new Set([0]); inv.forEach(p=>{const nx=new Set(s); s.forEach(v=>{for(let k=1;k<=p.n;k++) nx.add(r2(v+p.w*k));}); s=nx;}); return [...s]; }
function nearest(arr,w,dir){ // dir 用嚟打破平手
  let best=arr[0],bd=1e9; arr.forEach(v=>{const d=Math.abs(v-w); if(d<bd-1e-9||(Math.abs(d-bd)<1e-9&&dir&&Math.sign(v-w)===dir)){bd=d;best=v;}}); return best; }
function stepTo(eq,w,dir){ const a=achievable(eq); const i=a.findIndex(v=>Math.abs(v-w)<1e-9);
  if(i<0){ if(dir>0){const n=a.find(v=>v>w+1e-9);return n!=null?n:a[a.length-1];} if(dir<0){let n=null;a.forEach(v=>{if(v<w-1e-9)n=v;});return n!=null?n:a[0];} return nearest(a,w,0); }
  return a[Math.max(0,Math.min(a.length-1,i+dir))]; }
function unitKg(eq){ if(eq.kind==='stack') return eq.step; if(eq.kind==='plates'){const ws=(eq.plates||[]).map(p=>p.w);return ws.length?Math.min(...ws):2.5;} return 0; }
function applyUnits(eq,w,u){
  if(eq.kind==='body') return 0;
  if(eq.kind==='missing') return w;
  if(eq.kind==='notch'){ const a=achievable(eq); let i=a.findIndex(v=>Math.abs(v-w)<1e-9); if(i<0) i=a.indexOf(nearest(a,w,0)); const n=u>0?Math.ceil(u-1e-9):Math.floor(u+1e-9); return a[Math.max(0,Math.min(a.length-1,i+n))]; }
  const dir=Math.sign(u); let t=nearest(achievable(eq),r2(w+u*unitKg(eq)),dir);
  if(dir&&Math.abs(t-w)<1e-9) t=stepTo(eq,w,dir);
  return t;
}
// 配重片分解：最少塊數
function platesBreak(eq,w){
  const inv=(eq.plates||[]).map(p=>({w:p.w,n:eq.perSide?Math.floor(p.n/2):p.n})).sort((a,b)=>b.w-a.w);
  let best=null;
  (function go(i,rem,used,cnt){ if(best&&cnt>=best.cnt) return; if(Math.abs(rem)<1e-9){best={cnt,used:used.slice()};return;} if(i>=inv.length||rem<-1e-9) return;
    const p=inv[i]; for(let k=Math.min(p.n,Math.floor(rem/p.w+1e-9));k>=0;k--){used[i]=k;go(i+1,r2(rem-p.w*k),used,cnt+k);} used[i]=0; })(0,r2(w),[],0);
  return best?inv.map((p,i)=>({w:p.w,k:best.used[i]||0,max:p.n})):null;
}
function stackParts(eq,w){
  const adds=eq.addons||[]; const combos=[];
  for(let m=0;m<(1<<adds.length);m++){let s=0;adds.forEach((a,i)=>{if(m&(1<<i))s+=a.w;});combos.push([m,r2(s)]);}
  combos.sort((a,b)=>a[1]-b[1]);
  for(const [m,s] of combos){const b=r2(w-s); if(b>=eq.min-1e-9&&b<=eq.max+1e-9&&Math.abs(((b-eq.min)/eq.step)-Math.round((b-eq.min)/eq.step))<1e-6) return {base:b,mask:m,extra:s};}
  return {base:w,mask:0,extra:0};
}
function totalKg(ex,eq,w){ if(eq.kind==='plates') return r2((eq.base||0)+(eq.perSide?2:1)*w); if(eq.kind==='stack'&&ex&&ex.perSide) return r2(w*2); return w; }
function shortW(ex,eq,w){
  if(eq.kind==='missing') return fmtW(w)+'kg';
  if(eq.kind==='body') return '徒手';
  if(eq.kind==='notch') return fmtW(w)+'kg'+(eq.perHand?' 每隻手':'');
  if(eq.kind==='plates') return (eq.perSide?'每邊 ':'')+fmtW(w)+'kg'+(eq.base||eq.perSide?' · 總 '+fmtW(totalKg(ex,eq,w))+'kg':'');
  if(ex&&ex.perSide) return fmtW(w)+'kg ×2 = '+fmtW(w*2)+'kg';
  return fmtW(w)+'kg';
}
function longW(ex,eq,w){
  if(eq.kind==='plates'){const b=platesBreak(eq,w);const txt=b?b.filter(p=>p.k).map(p=>fmtW(p.w)+(p.k>1?'×'+p.k:'')).join(' + ')||'淨'+(eq.base?'槓':''):'砌唔到';
    return (eq.perSide?'每邊 ':'')+fmtW(w)+'kg（'+txt+'）· 總重 '+fmtW(totalKg(ex,eq,w))+'kg'+(eq.base?'（連 '+fmtW(eq.base)+'kg 槓）':'');}
  if(eq.kind==='stack'){const p=stackParts(eq,w);const parts=p.extra?`配重 ${fmtW(p.base)} + 加重片 ${fmtW(p.extra)}`:'';
    if(ex&&ex.perSide) return `兩邊各 ${fmtW(w)}kg${parts?'（'+parts+'）':''} · 合共 ${fmtW(w*2)}kg`; return parts?parts+' kg':'';}
  return '';
}

/* ====================== 預設資料 ====================== */
const SEED_RPE={'yyy':2,'yy':3,'y':4,'':6,'n':7,'nn':8,'nnn':9,'yyh':3};
function defaultData(){
  const E=[
   {id:'latpull',name:'器械下拉',en:'Lat Pulldown',cat:'back',rest:120,perSide:true,variants:[{eq:'cable',weight:30}],seed:['cable','yyy'],
    notes:'握距略闊於膊頭，挺胸、膊頭沉低，用背部發力拉到上胸位置，唔好用身體後仰借力。放返上去時完全伸展。'},
   {id:'row',name:'坐姿划船',en:'Seated Cable Row',cat:'back',rest:120,perSide:true,variants:[{eq:'cable',weight:25}],seed:['cable','n'],
    notes:'腰背挺直，拉嘅時候肩胛骨向後夾，手肘貼身拉到肚臍位置，再慢慢放返出去。唔好聳肩。'},
   {id:'curl',name:'二頭彎舉',en:'Dumbbell Curl',cat:'biceps',rest:60,variants:[{eq:'dumbbell',weight:6.5}],seed:['dumbbell',''],
    notes:'手肘固定喺身側，唔好前後擺動，頂峰收緊一秒再慢慢放低（放低用 2–3 秒）。'},

function migrate(d){
  if(!d.equip) d.equip=defaultEquip();
  Object.values(d.equip).forEach(e=>{if(e.mt==null)e.mt=0;});
  d.deleted=d.deleted||{}; d.schedAt=d.schedAt||0; d.ex=d.ex||{}; d.logs=Array.isArray(d.logs)?d.logs:[]; d.schedule=d.schedule||{};
  Object.keys(d.schedule).forEach(k=>{const s=d.schedule[k]||{};d.schedule[k]={main:Array.isArray(s.main)?s.main:[],extras:Array.isArray(s.extras)?s.extras:[],at:s.at||0,memo:typeof s.memo==='string'?s.memo:''};});
  Object.values(d.ex).forEach(e=>{if(!Array.isArray(e.variants)||!e.variants.length)e.variants=[{eq:'bodyweight',weight:0}];
    e.sets=Math.min(20,Math.max(1,parseInt(e.sets)||4)); e.reps=Math.min(200,Math.max(1,parseInt(e.reps)||12)); e.rest=Math.min(900,Math.max(0,parseInt(e.rest)>=0?parseInt(e.rest):60));});
  if(d.ex.legraise&&!d.ex.calfraise&&!d.deleted['ex:calfraise']){const e=d.ex.legraise;delete d.ex.legraise;e.id='calfraise';e.name='槓鈴站立提踵';e.en='Standing Barbell Calf Raise';e.mt=Date.now();d.ex.calfraise=e;
    Object.values(d.schedule).forEach(s=>{s.main=s.main.map(x=>x==='legraise'?'calfraise':x);s.extras=s.extras.map(x=>x==='legraise'?'calfraise':x);});d.logs.forEach(l=>{if(l.ex==='legraise')l.ex='calfraise';if(l.id==='seed_legraise')l.id='seed_calfraise';});}
  d.v=3; return d;
}

function logsFor(exId,eq){return S.logs.filter(l=>l.ex===exId&&(!eq||l.eq===eq)).sort((a,b)=>b.ts-a.ts);}
function variantOf(ex,eq){return ex.variants.find(v=>v.eq===eq)||ex.variants[0];}
function suggest(ex,eqId){
  const eq=equipOf(eqId); const v=variantOf(ex,eqId); const ls=logsFor(ex.id,eqId);
  if(!ls.length) return {w:v.weight,u:0,dir:0,tier:'',msg:'未有紀錄，用預設重量'};
  const l0=ls[0]; const {u,why,target}=planNext(l0.rpe,l0.weight,ls.slice(1),Date.now());
  if(eq.kind==='body') return {w:0,u,dir:Math.sign(u),tier:tierOf(u),msg:u>0?'上次輕鬆：加次數或者加難度':u<0?'上次太辛苦：減少次數':why};
  const w=target!=null?nearest(achievable(eq),target,0):applyUnits(eq,l0.weight,u); const d=r2(w-l0.weight);
  return {w,u,dir:Math.sign(d),tier:tierOf(u),msg:why+(d?`（${d>0?'+':''}${fmtW(d)}kg）`:'')};
}

/* ---------- 訓練流程 ---------- */
async function startSession(dow){
  if(W&&W.queue&&W.queue.length&&!(await ask('有一個未完成嘅訓練，要放棄佢重新開始？（已記錄嘅動作會保留）','重新開始'))) return;
  W={dow,date:todayStr(),start:Date.now(),queue:S.schedule[dow].main.filter(id=>S.ex[id]),idx:0,done:[],step:null,extraMode:false,hist:[]};
  clearRest();
  if(!W.queue.length){toast('呢日未有動作');W=null;saveSession();return;}
  enterExercise();
  W.preStart={end:Date.now()+300000,total:300,prep:!P.prep,zero:false};
  saveSession(); go('prep');
}
function resumeSession(){ W.hist=W.hist||[]; if(!W.step) enterExercise(); if(!W.step){go('extras');return;}
  if(W.preStart&&W.preStart.end>Date.now()){go('prep');return;}
  if(W.preStart){W.preStart=null;saveSession();}
  go(W.brk?'break':'workout'); }
async function discardSession(){
  if(!(await ask('放棄呢次訓練？已經記錄咗嘅動作會保留。','放棄'))) return;
  W=null; clearRest(); saveSession(); toast('已放棄'); go('home');
}
function enterExercise(){
  clearRest(); W.brk=null;
  while(W.idx<W.queue.length&&!S.ex[W.queue[W.idx]]) W.idx++;
  if(W.idx>=W.queue.length){W.step=null;return;}
  const ex=S.ex[W.queue[W.idx]];
  const needAsk=ex.variants.length>1&&ex.ask&&ex.defaultEq==null;
  const eq=needAsk?null:(ex.defaultEq&&ex.variants.some(v=>v.eq===ex.defaultEq)?ex.defaultEq:ex.variants[0].eq);
  W.step={ex:ex.id,eq,weight:eq?suggest(ex,eq).w:null,rpe:null,sets:0,doing:false};
}
function chooseEq(eq,remember){

/* ---------- 加操 ---------- */
function tomorrowInfo(date){ const k=String((dowOf(date)+1)%7); const s=S.schedule[k]; if(!s||!s.main.length) return null;
  const ids=s.main.filter(id=>S.ex[id]); return {k,ids,cats:new Set(ids.map(id=>S.ex[id].cat).filter(c=>c!=='other'))}; }
function clashOf(id,tm){ const e=S.ex[id]; if(!tm||!e) return ''; if(tm.ids.includes(id)) return `聽日（星期${DAYS[tm.k]}）有做呢個`; if(tm.cats.has(e.cat)) return `聽日（星期${DAYS[tm.k]}）要練${CATS[e.cat]}`; return ''; }
function renderExtras(){
  if(!W) return renderHome();

  const done=new Set(W.queue); const tm=tomorrowInfo(W.date);
  const recentIds=[...new Set(S.logs.filter(l=>l.extra).sort((a,b)=>b.ts-a.ts).map(l=>l.ex))].filter(id=>S.ex[id]&&!done.has(id)).slice(0,6);
  const sugg=sch.extras.filter(id=>S.ex[id]&&!done.has(id));
  const btn=id=>{const e=S.ex[id];const eqId=e.defaultEq||e.variants[0].eq;const sg=suggest(e,eqId);const c=clashOf(id,tm);
    return `<button class="choice${c?' clash':''}" onclick="addExtra('${id}')"><b>${esc(e.name)}</b><span>${CATS[e.cat]||''} · ${shortW(e,equipOf(eqId),sg.w)} · ${esc(sg.msg)}</span>${c?`<span class="warn-tag">⚠ ${esc(c)}</span>`:''}</button>`;};
  let html=`<div class="topbar"><button class="icon-btn" onclick="go('home')">${ICON.back}</button><div class="title">今日要唔要加動作？${CLOCK()}</div>${SPACER}</div>
    <div class="sub center mb">主課表做完 🎉 想加就揀一個；唔加就撳「完成今日訓練」。</div>`;
  const memo=sch.memo||'';
  html+=`<div class="card memo"><div class="row between"><b>📌 星期${DAYS[W.dow]}提醒</b><button class="badge" onclick="openMemo('${W.dow}')">✎ ${memo?'改':'寫低'}</button></div>${memo?`<div class="notes mt">${esc(memo)}</div>`:'<div class="sub small mt">可以寫低想提醒自己嘅嘢，例如「聽日練腹，今日唔好加腹部」。</div>'}</div>`;
  if(tm) html+=`<div class="card warnc"><b>⚠ 聽日星期${DAYS[tm.k]}要練：${[...tm.cats].map(c=>CATS[c]).join('、')||'—'}</b><div class="sub small mt">${tm.ids.map(id=>esc(S.ex[id].name)).join('、')}</div><div class="sub small mt">下面標住 ⚠ 嘅動作，今日做咗可能會影響聽日。</div></div>`;
  if(sugg.length) html+=`<h2>今日建議加</h2>`+sugg.map(btn).join('');
  if(recentIds.length) html+=`<h2>最近加過</h2>`+recentIds.map(btn).join('');
  DAY_ORDER.forEach(k=>{const s=S.schedule[k]; if(!s) return;
    const ids=[...new Set(s.main.concat(s.extras))].filter(id=>S.ex[id]&&!done.has(id)&&!sugg.includes(id));
    if(ids.length) html+=`<h2>星期${DAYS[k]}</h2>`+ids.map(btn).join('');});
  const scheduled=new Set(); Object.values(S.schedule).forEach(s=>s.main.concat(s.extras).forEach(id=>scheduled.add(id)));
  const others=Object.keys(S.ex).filter(id=>!scheduled.has(id)&&!done.has(id));

  html+=`<div class="bottom"><div class="row"><button class="skip" onclick="goBack()" ${(W.hist||[]).length?'':'disabled'}>‹ 返回</button><button class="primary" onclick="finishSession()">完成今日訓練</button></div></div>`;
  return html;
}

/* ---------- 每週進度 ---------- */
function weekStartDate(ref){ const x=new Date(ref); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
// 呢條紀錄係跟邊日嘅課表做（舊紀錄冇記低就估）
function sdOf(l){
  if(l.sd!=null) return String(l.sd);
  const k=String(dowOf(l.date)); const s=S.schedule[k];
  if(s&&(s.main.includes(l.ex)||s.extras.includes(l.ex))) return k;
  return DAY_ORDER.find(d=>S.schedule[d]&&S.schedule[d].main.includes(l.ex))||k;
}
function weekInfo(ref){
  const ws=weekStartDate(ref); const dates=DAY_ORDER.map((k,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return dstr(d);});
  const today=todayStr(); const logs=S.logs.filter(l=>!l.seed&&l.date>=dates[0]&&l.date<=dates[6]);
  const days=DAY_ORDER.map((k,i)=>{
    const date=dates[i], s=S.schedule[k], planned=!!(s&&s.main.length);
    const own=logs.filter(l=>sdOf(l)===k), ownDates=[...new Set(own.map(l=>l.date))].sort();
    let status;
    if(planned){ if(own.length) status=ownDates.includes(date)?'done':'made'; else status=date<today?'miss':date===today?'today':'todo'; }
    else status=logs.some(l=>l.date===date)?'extra':'rest';
    return {k,date,planned,status,madeOn:status==='made'?ownDates[0]:null,isToday:date===today};
  });
  const pl=days.filter(d=>d.planned);
  return {days,dates,planned:pl.length,done:pl.filter(d=>d.status==='done'||d.status==='made').length,missed:pl.filter(d=>d.status==='miss'),todo:pl.filter(d=>d.status==='todo'||d.status==='today')};
}
function weekStrip(wi,popK){
  return `<div class="wk">${wi.days.map(d=>{let t='',sb='';
    if(d.status==='done') t='✓';
    else if(d.status==='made'){ t='✓'; sb='週'+DAYS[dowOf(d.madeOn)]+(d.madeOn<d.date?'做':'補'); }
    else if(d.status==='miss'){ t='!'; sb='未做'; }
    else if(d.status==='today') t='今';
    return `<div class="wkd${d.isToday?' istoday':''}"><span class="lb">${DAYS[d.k]}</span><span class="chip ${d.status}${popK!=null&&popK===d.k?' pop':''}">${t}</span><span class="sb">${sb}</span></div>`;}).join('')}</div>`;
}
function weekCardHome(){
  const wi=weekInfo(new Date()); if(!wi.planned) return '';
  const usedBefore=S.logs.some(l=>!l.seed&&l.date<wi.dates[0]); const lw=usedBefore?weekInfo(new Date(Date.now()-7*DAY)):null;
  let msg;
  if(wi.done>=wi.planned) msg=`<span style="color:var(--green)">🚀 今個星期 ${wi.planned} 日全部做齊！</span>`;
  else if(wi.missed.length) msg=`星期${wi.missed.map(d=>DAYS[d.k]).join('、')}未做 — 搵日補返佢就得 💪`;
  else msg=`今個星期做咗 ${wi.done}/${wi.planned} 日${wi.done?'，繼續保持 🔥':''}`;
  const pills=wi.missed.filter(d=>V.dayOverride==null||+V.dayOverride!==+d.k).map(d=>`<button class="pill makeup" onclick="V.dayOverride=${d.k};render()">↺ 今日補返星期${DAYS[d.k]}</button>`).join('');
  return `<div class="card mt"><div class="row between"><b>今個星期</b><span class="sub small">${wi.done}/${wi.planned} 日${lw&&lw.planned?` · 上星期 ${lw.done}/${lw.planned}${lw.done>=lw.planned?' ✓':''}`:''}</span></div>${weekStrip(wi)}<div class="wkmsg">${msg}</div>${pills?`<div class="pill-row mt" style="padding-bottom:0">${pills}</div>`:''}</div>`;
}
function weekStreak(){
  let n=0; const ws=weekStartDate(new Date());
  for(let w=0;w<156;w++){ const a=new Date(ws); a.setDate(a.getDate()-7*w); const b=new Date(a); b.setDate(b.getDate()+6); const as=dstr(a), bs=dstr(b);
    if(S.logs.some(l=>!l.seed&&l.date>=as&&l.date<=bs)) n++; else if(w>0) break; }
  return n;
}
function celebrateMsg(wi,k,date){
  const dk=wi.days.find(d=>d.k===k);
  const made=dk&&dk.status==='made'&&dk.date<date, early=dk&&dk.status==='made'&&dk.date>date;
  if(wi.planned&&wi.done>=wi.planned) return {kind:'week',title:'🚀 成個星期全部做齊！',sub:`${wi.planned} 日全部完成${made?`（包括補返星期${DAYS[k]}）`:''}，你好犀利！下星期繼續 💪`};
  const left=wi.missed.filter(d=>d.k!==k);
  if(made) return {kind:'made',title:`🚀 補返星期${DAYS[k]} ✓`,sub:'漏咗都識補返，呢份堅持好難得！'+(left.length?`仲有星期${left.map(d=>DAYS[d.k]).join('、')}，有機會都補埋佢。`:`今個星期 ${wi.done}/${wi.planned} 日。`)};
  if(early) return {kind:'made',title:`⚡ 提早做咗星期${DAYS[k]}`,sub:`今個星期 ${wi.done}/${wi.planned} 日，好主動！`};
  if(left.length) return {kind:'miss',title:`今個星期 ${wi.done}/${wi.planned} 日 <span>💪</span>`,sub:`星期${left.map(d=>DAYS[d.k]).join('、')}未做 — 冇問題，搵日補返佢，下次做返就得！`};
  return {kind:'ok',title:`今個星期 ${wi.done}/${wi.planned} 日 ✓`,sub:wi.todo.length?`仲有 ${wi.todo.length} 日，繼續保持 🔥`:'繼續保持 🔥'};
}

function runCelebration(){

function countUp(el,n,dur,delay){ el.textContent='0'; const t0=performance.now()+delay;
  const f=t=>{ if(!el.isConnected) return; const p=Math.min(1,Math.max(0,(t-t0)/dur)); el.textContent=Math.round(n*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function confetti(n,fromTop){
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const dpr=Math.min(2,window.devicePixelRatio||1), cw=innerWidth, chh=innerHeight; c.width=cw*dpr; c.height=chh*dpr;
  const x=c.getContext('2d'); if(!x){c.remove();return;} x.scale(dpr,dpr);
  const cols=['#30d158','#0a84ff','#ffd60a','#ff9f0a','#bf5af2','#ff453a','#64d2ff','#ffffff'];
  const ps=Array.from({length:n},()=>Object.assign(fromTop?{x:Math.random()*cw,y:-20-Math.random()*chh*.5,vx:(Math.random()-.5)*3,vy:Math.random()*3+2}:{x:cw/2+(Math.random()-.5)*60,y:chh*.3,vx:(Math.random()-.5)*17,vy:-Math.random()*15-5},
    {r:Math.random()*6.28,vr:(Math.random()-.5)*.35,w:5+Math.random()*6,h:8+Math.random()*8,c:cols[Math.random()*cols.length|0],round:Math.random()<.3}));
  const t0=performance.now();
  const f=t=>{ const el=t-t0; x.clearRect(0,0,cw,chh); let alive=0;
    ps.forEach(p=>{ p.vy=Math.min(p.vy+.32,7); p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y<chh+30) alive++;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=el>2700?Math.max(0,1-(el-2700)/700):1; x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,6.28);x.fill();} else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3))+1);
      x.restore(); });
    if(alive&&el<3500) requestAnimationFrame(f); else c.remove(); };
  requestAnimationFrame(f);
}
function launchRocket(big){
  const r=document.createElement('div'); r.className='rocket'; r.textContent='🚀'; if(!big) r.style.fontSize='54px'; document.body.appendChild(r);
  const H=innerHeight, dur=big?2000:1600;

    {transform:'translate(-58%,-104px) rotate(-50deg) scale(1)',offset:.24},

    {transform:`translate(-50%,${-H*.45}px) rotate(-45deg) scale(1.1)`,offset:.62},
    {transform:`translate(-50%,${-H-220}px) rotate(-45deg) scale(1.35)`}],{duration:dur,easing:'cubic-bezier(.5,0,.75,.35)'}); }catch(e){ r.remove(); return; }
  const t0=performance.now();
  (function trail(){ if(!r.isConnected) return; const b=r.getBoundingClientRect();
    if(b.bottom>-40&&performance.now()-t0>dur*.1){ const s=10+Math.random()*18, p=document.createElement('div'); p.className='puff';
      Object.assign(p.style,{left:(b.left+b.width/2-s/2+(Math.random()-.5)*12)+'px',top:(b.bottom-10)+'px',width:s+'px',height:s+'px'}); document.body.appendChild(p);

    setTimeout(trail,38); })();

function progRow(id){

/* ---- Apple 健康風格圖表：時間範圍 + 左右掃 ---- */
const RANGES=[['3D','3日',3],['W','週',7],['M','月',30],['6M','6月',182],['Y','年',365]];
const DAY=86400000;
function openDetail(id){ V.exId=id; V.sel=null; V.range=V.range||'M'; V.end=null; render(); }
function setRange(k){ V.range=k; V.end=null; V.sel=null; render(); }
function renderProgressDetail(){

  html+=`<div class="chart-wrap"><div class="seg sm" style="margin:0 2px 4px">${RANGES.map(([k,t])=>`<button class="${(V.range||'M')===k?'on':''}" onclick="setRange('${k}')">${t}</button>`).join('')}</div><div id="chartBox" class="chartbox" onpointerdown="chartDown(event)" onpointermove="chartMove(event)" onpointerup="chartUp(event)" onpointercancel="chartCancel(event)">${chartInner(ls)}</div>
    <div class="legend">1 輕鬆<div class="g" style="background:linear-gradient(90deg,${RPE_COLORS.slice(1).join(',')})"></div>10 力竭</div>
    <div class="tooltip" id="tip">${V.sel!=null&&ls[V.sel]?tipHtml(ls[V.sel]):'<span class="sub">撳圖上嘅點睇當日重量同難度 · 左右掃可以睇其他日子</span>'}</div></div>`;

function chartWindow(ls){

  const first=ls[0].ts, last=ls[ls.length-1].ts, now=Date.now();

function tipHtml(l){const e=S.ex[l.ex];const eq=equipOf(l.eq);return `<div class="row between"><b>${l.date}</b><b style="color:${colorOf(l.rpe)}">難度 ${l.rpe}/10 · ${RPE[l.rpe]?RPE[l.rpe].t:''}</b></div><div class="sub small mt">${esc(eq.name)} · ${eq.kind==='body'?'徒手':shortW(e,eq,l.weight)} · ${l.sets||4} 組${l.extra?' · 加操':''}${l.seed?' · 舊筆記':''}${l.note?'<br>📝 '+esc(l.note):''}</div>`;}
function chartInner(ls){
  const win=chartWindow(ls);
  const vis=ls.map((l,i)=>({l,i})).filter(o=>o.l.ts>=win.x0&&o.l.ts<=win.x1);
  const dateTxt=d=>{const x=new Date(d);return (win.days>=182?x.getFullYear()+'年':'')+(x.getMonth()+1)+'月'+x.getDate()+'日';};
  let head;
  if(vis.length){const ys=vis.map(o=>o.l.weight);const a=Math.min(...ys),b=Math.max(...ys);head=`<div><div class="k">範圍</div><div class="v">${a===b?fmtW(a):fmtW(a)+'–'+fmtW(b)}<small> kg</small></div></div>`;}
  else head=`<div><div class="k">範圍</div><div class="v"><small>呢段時間冇紀錄</small></div></div>`;
  head=`<div class="rangehead">${head}<div class="d" style="text-align:right">${dateTxt(win.x0)} – ${dateTxt(win.x1)}</div></div>`;
  return head+chartSVG(ls,win,vis);
}
function chartSVG(ls,win,vis){
  const Wd=chartW(),H=Wd>500?300:230,pl=CH.pl,pr=CH.pr,pt=14,pb=30;
  const base=vis.length?vis.map(o=>o.l.weight):ls.map(l=>l.weight);
  let y0=Math.min(...base),y1=Math.max(...base); const pad=Math.max(2.5,(y1-y0)*0.25); y0=Math.max(0,y0-pad); y1=y1+pad;
  const X=t=>pl+(t-win.x0)/win.span*(Wd-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  let g=`<defs><clipPath id="clip"><rect x="${pl}" y="0" width="${Wd-pl-pr}" height="${H}"/></clipPath></defs>`;
  for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2c2c30" stroke-width="1"/><text x="${Wd-pr+8}" y="${Y(v)+4}" fill="#8e8e93" font-size="11">${fmtW(Math.round(v*2)/2)}</text>`;}
  // x 軸刻度
  const ticks=[]; const s=new Date(win.x0); s.setHours(0,0,0,0);
  if(win.days<=7){for(let t=s.getTime();t<=win.x1;t+=DAY) ticks.push([t,(new Date(t).getMonth()+1)+'/'+new Date(t).getDate()]);}
  else if(win.days<=31){const d=new Date(s);d.setDate(d.getDate()-((d.getDay()+6)%7));for(let t=d.getTime();t<=win.x1;t+=7*DAY) ticks.push([t,(new Date(t).getMonth()+1)+'/'+new Date(t).getDate()]);}
  else {const d=new Date(s.getFullYear(),s.getMonth(),1);while(d.getTime()<=win.x1){ticks.push([d.getTime(),(d.getMonth()+1)+'月']);d.setMonth(d.getMonth()+1);}}
  ticks.forEach(([t,lab])=>{if(t<win.x0)return;const x=X(t);g+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb}" stroke="#2c2c30" stroke-width="1" stroke-dasharray="2,3"/><text x="${x}" y="${H-10}" fill="#8e8e93" font-size="11" text-anchor="middle">${lab}</text>`;});
  g+=`<g clip-path="url(#clip)">`;
  const eqs=[...new Set(ls.map(l=>l.eq))];
  eqs.forEach((eq,k)=>{const pts=ls.filter(l=>l.eq===eq).map(l=>`${X(l.ts).toFixed(1)},${Y(l.weight).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="${k?'5,4':''}" opacity=".6"/>`;});
  vis.forEach(({l,i})=>{const sel=V.sel===i;g+=`<circle cx="${X(l.ts).toFixed(1)}" cy="${Y(l.weight).toFixed(1)}" r="${sel?9:7}" fill="${colorOf(l.rpe)}" stroke="#fff" stroke-width="${sel?3:0}"/>`;});
  g+=`</g>`;
  if(eqs.length>1) g+=eqs.map((eq,k)=>`<text x="${pl+4}" y="${pt+12+k*14}" fill="#8e8e93" font-size="11">${k?'- - ':'—— '}${esc(equipOf(eq).name)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
let drag=null;
const CH={pl:12,pr:44};
const chartW=()=>window.innerWidth>=800?820:500;
function chartCancel(e){ drag=null; e.currentTarget.classList.remove('drag'); }
function chartDown(e){const box=e.currentTarget;const r=box.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,end:V.end,w:r.width,left:r.left,moved:false,id:e.pointerId};}
function chartMove(e){
  if(!drag) return; const dx=e.clientX-drag.x;
  if(!drag.moved){ if(Math.abs(dx)<=6) return; drag.moved=true; e.currentTarget.classList.add('drag'); try{e.currentTarget.setPointerCapture(drag.id);}catch(x){} }
  const ls=logsFor(V.exId).sort((a,b)=>a.ts-b.ts); const win=chartWindow(ls);
  V.end=drag.end-dx/drag.w*win.span*(chartW()/(chartW()-CH.pl-CH.pr));
  e.currentTarget.innerHTML=chartInner(ls);
}
function chartUp(e){
  if(!drag) return; const d=drag; drag=null; e.currentTarget.classList.remove('drag');
  if(d.moved||Math.abs(e.clientY-d.y)>10) return;
  // 冇拖動 = 點一下：揀最近嗰點（Apple 健康風格）
  const ls=logsFor(V.exId).sort((a,b)=>a.ts-b.ts); const win=chartWindow(ls);
  const sx=(e.clientX-d.left)/d.w*chartW(); const t=win.x0+(sx-CH.pl)/(chartW()-CH.pl-CH.pr)*win.span;
  let best=null,bd=1e18; ls.forEach((l,i)=>{if(l.ts<win.x0||l.ts>win.x1)return;const dd=Math.abs(l.ts-t);if(dd<bd){bd=dd;best=i;}});
  if(best!=null&&bd<win.span*0.08){V.sel=V.sel===best?null:best;render();}
}

function touchSched(day){const now=Date.now();S.schedAt=now;const d=day!=null?day:V.tab;if(S.schedule[d])S.schedule[d].at=now;}

async function delEx(id){ if(!S.ex[id]) return;
  if(!(await ask('刪除「'+S.ex[id].name+'」？佢嘅所有紀錄都會一齊刪除。','刪除'))) return;
  const now=Date.now(); delete S.ex[id]; S.deleted['ex:'+id]=now;
  Object.keys(S.schedule).forEach(k=>{const s=S.schedule[k];if(s.main.includes(id)||s.extras.includes(id)){s.main=s.main.filter(x=>x!==id);s.extras=s.extras.filter(x=>x!==id);touchSched(k);}});
  S.logs=S.logs.filter(l=>{if(l.ex===id){S.deleted[l.id]=now;return false;}return true;});
  if(W&&W.queue){const before=W.queue.slice(0,W.idx).filter(x=>x===id).length;W.queue=W.queue.filter(x=>x!==id);W.idx=Math.max(0,W.idx-before);if(W.step&&W.step.ex===id)enterExercise();if(!W.queue.length)W=null;saveSession();}
  save(); render();
}

const parseNums=s=>String(s||'').split(/[,，、\s]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x)&&x>0);
function saveEquip(){
  const name=$('#q_name').value.trim(); if(!name){toast('請輸入名稱');return;}

  const id=V.id&&S.equip[V.id]?V.id:('eq_'+uid());

  if(kind==='notch'){q.notches=[...new Set(parseNums($('#q_notches').value))].sort((a,b)=>a-b);q.perHand=$('#q_perHand').classList.contains('on');if(!q.notches.length){toast('請輸入檔位');return;}}
  else if(kind==='stack'){q.min=num($('#q_min').value)||0;q.max=num($('#q_max').value)||q.min;q.step=num($('#q_step').value)||5;const oldAdd=((S.equip[id]||{}).addons)||[]; q.addons=parseNums($('#q_addons').value).map(w=>({w,name:(oldAdd.find(a=>Math.abs(a.w-w)<1e-9)||{}).name||'加重片'}));if(q.max<q.min){toast('最高要大過最低');return;}if(q.step<0.25){toast('每格最少 0.25kg');return;}if(q.addons.some(a=>a.w>=q.step-1e-9)){toast('加重片要細過每格（'+fmtW(q.step)+'kg）');return;}if((q.max-q.min)/q.step>400){toast('格數太多，請檢查最低／最高／每格');return;}}
  else if(kind==='plates'){q.base=num($('#q_base').value)||0;q.perSide=$('#q_perSide').classList.contains('on');
    q.plates=String($('#q_plates').value).split(/[,，]+/).map(s=>{const m=s.trim().match(/^([\d.]+)\s*[x×*]\s*(\d+)$/i);return m?{w:parseFloat(m[1]),n:parseInt(m[2])}:null;}).filter(p=>p&&p.w>0&&p.n>0).sort((a,b)=>b.w-a.w);
    if(!q.plates.length){toast('請輸入配重片，例如 20x2, 10x2');return;}}
  S.equip[id]=q; delete S.deleted['eq:'+id]; V.kind=null; V._keepName=null;
  Object.values(S.ex).forEach(e=>e.variants.forEach(v=>{if(v.eq===id)v.weight=nearest(achievable(q),v.weight,0);}));

}

const GH='https://api.github.com', GFILE='gymlog.json', GDESC='Gym Log data';
let SY=loadJSON(LS_SYNC)||{}, syncing=false, syncPending=false, syncTimer=null, syncStatus='';
function saveSY(){try{localStorage.setItem(LS_SYNC,JSON.stringify(SY));}catch(e){} idbSet('sync',SY);}
/* token 另外喺 IndexedDB 留一份：localStorage 唔見咗都可以自動搵返 */
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('gymlog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbSet(k,v){try{const db=await idbOpen();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(JSON.parse(JSON.stringify(v)),k);t.oncomplete=res;t.onerror=()=>rej(t.error);});db.close();}catch(e){}}
async function idbGet(k){try{const db=await idbOpen();const v=await new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const q=t.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});db.close();return v;}catch(e){return undefined;}}
const STANDALONE=!!((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone);
async function restoreSY(){
  if(SY.token){ if(!(await idbGet('sync'))) idbSet('sync',SY); return; }
  const b=await idbGet('sync'); if(b&&b.token&&!SY.token){ SY=b; try{localStorage.setItem(LS_SYNC,JSON.stringify(SY));}catch(e){} render(); syncNow(false); }
}
function setSyncStatus(t){syncStatus=t;document.querySelectorAll('#syncLine,#syncLine2').forEach(e=>e.textContent=t);}
function scheduleSync(){ if(!SY.token) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(false),2000); setSyncStatus('有更改未同步…'); }
function ghH(){return {'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};}
async function ghJSON(url,opt){
  const r=await fetch(url,Object.assign({headers:ghH(),cache:'no-store'},opt||{}));
  if(r.status===401) throw new Error('Token 無效或者過期');
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub '+r.status);
  return r.json();
}
async function ghFindGist(){
  for(let p=1;p<=5;p++){const arr=await ghJSON(`${GH}/gists?per_page=100&page=${p}`); if(!arr) break;
    const g=arr.find(g=>g.files&&g.files[GFILE]); if(g) return g.id; if(arr.length<100) break;}
  return null;
}
async function ghRead(id){
  const g=await ghJSON(`${GH}/gists/${id}`); if(!g) return {missing:true};
  const f=g.files&&g.files[GFILE]; if(!f) return {data:null};
  let c=f.content; if(f.truncated){c=await (await fetch(f.raw_url,{cache:'no-store'})).text();}
  return {data:JSON.parse(c)};
}
async function ghWrite(id,data){
  const files={[GFILE]:{content:JSON.stringify(data)}};
  if(id){ await ghJSON(`${GH}/gists/${id}`,{method:'PATCH',body:JSON.stringify({files})}); return id; }
  const g=await ghJSON(`${GH}/gists`,{method:'POST',body:JSON.stringify({description:GDESC,public:false,files})}); return g.id;
}
function mergeData(a,b){ // a = 呢部機, b = 雲端；同一時間（例如兩部機都係預設資料）以雲端為準
  a=migrate(JSON.parse(JSON.stringify(a))); b=migrate(JSON.parse(JSON.stringify(Object.assign({ex:{},logs:[],schedule:{}},b))));
  const del={}; [a.deleted||{},b.deleted||{}].forEach(m=>Object.keys(m).forEach(k=>{del[k]=Math.max(del[k]||0,m[k]);}));
  const dead=(key,mt)=>del[key]!=null&&del[key]>=(mt||0);
  const pick=(o,n)=>!o||(n.mt||0)>(o.mt||0)?n:o;
  const byMt=(key,pre)=>{const out={};[b,a].forEach(src=>Object.values(src[key]||{}).forEach(e=>{if(!dead(pre+e.id,e.mt))out[e.id]=pick(out[e.id],e);}));return out;};
  const ex=byMt('ex','ex:'), equip=byMt('equip','eq:');
  // 有動作仲用緊嘅器材唔好刪
  Object.values(ex).forEach(e=>e.variants.forEach(v=>{if(!equip[v.eq]){const src=(a.equip||{})[v.eq]||(b.equip||{})[v.eq];if(src){equip[v.eq]=src;delete del['eq:'+v.eq];}}}));
  const logs={}; [b.logs,a.logs].forEach(arr=>arr.forEach(l=>{if(!dead(l.id,l.mt))logs[l.id]=pick(logs[l.id],l);}));
  const schedule={};
  new Set(Object.keys(a.schedule||{}).concat(Object.keys(b.schedule||{}))).forEach(k=>{
    const sa=(a.schedule||{})[k], sb=(b.schedule||{})[k];
    const s=!sb?sa:!sa?sb:((sa.at||0)>(sb.at||0)?sa:sb), o=s===sa?sb:sa;
    // 舊版 app 同步時會漏咗提醒：同一時間嘅話保留有寫嘢嗰個
    const memo=s.memo||(o&&(o.at||0)===(s.at||0)?o.memo:'')||'';
    schedule[k]={main:s.main.filter(id=>ex[id]),extras:s.extras.filter(id=>ex[id]),at:s.at||0,memo};
  });
  const sortObj=o=>{const s={};Object.keys(o).sort().forEach(k=>s[k]=o[k]);return s;};
  return {v:3,ex:sortObj(ex),equip:sortObj(equip),schedule:sortObj(schedule),schedAt:Math.max(a.schedAt||0,b.schedAt||0),logs:Object.values(logs).sort((x,y)=>x.ts-y.ts||(x.id<y.id?-1:1)),deleted:sortObj(del)};
}
async function syncNow(manual){
  if(!SY.token) return;
  if(syncing){syncPending=true;return;}
  syncing=true; setSyncStatus('同步中…');
  try{
    if(!SY.gistId){SY.gistId=await ghFindGist();saveSY();}
    let remote=null;
    if(SY.gistId){const r=await ghRead(SY.gistId); if(r.missing){SY.gistId=null;} else remote=r.data;}
    const before=JSON.stringify(S);
    const merged=remote?mergeData(S,remote):mergeData(S,{});
    const out=JSON.stringify(merged);
    S=merged; saveLocal();
    if(!remote||out!==JSON.stringify(remote)){SY.gistId=await ghWrite(SY.gistId,merged);}
    SY.last=Date.now(); saveSY();
    const t=new Date(); setSyncStatus('已同步 '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0'));
    if(manual) toast('同步完成 ✓');
    const typing=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(out!==before&&!typing&&Date.now()>=flyUntil&&!$('#modal').classList.contains('show')&&!['exform','eqform','summary'].includes(V.view)) render();
  }catch(e){ setSyncStatus('同步失敗：'+e.message); if(manual) toast('同步失敗：'+e.message); }
  finally{ syncing=false; if(syncPending){syncPending=false;syncNow(false);} }
}

    <button class="primary blue mt" onclick="connectSync()">連接同步</button></div>`;
  return `<h2>iPhone ↔ iPad 同步</h2><div class="card">
    <div class="row between"><div><b>已連接 GitHub</b><div class="sub small" id="syncLine2">${esc(syncStatus||'')}</div></div><span class="badge green">開啟</span></div>
    <div class="row mt"><button class="secondary" onclick="syncNow(true)">立即同步</button><button class="secondary" onclick="disconnectSync()"><span class="danger">中斷同步</span></button></div>
    <div class="help mt">每次改動後約 2 秒自動上載；開返 app 時會自動下載。Token 儲存喺：<b>${STANDALONE?'主畫面 App':'瀏覽器（Safari）'}</b>（${esc(location.host)}）。</div></div>`;
}
function whereHelp(){
  return `<div class="help mt" style="padding:10px 12px;border-radius:12px;background:var(--card2)">而家開緊：<b style="color:var(--text)">${STANDALONE?'主畫面 App':'瀏覽器（Safari）'}</b> · ${esc(location.host)}<br>
    ⚠ iPhone 嘅「主畫面 App」同「Safari」係<b>分開儲存</b>嘅：喺 Safari 貼咗 token，開主畫面 App 係見唔到嘅（反之亦然）。請喺你平時開嘅嗰個度貼。${STANDALONE?'':'<br>Safari 仲會喺你 7 日冇開嘅時候清走資料，建議用主畫面 App。'}</div>`;
}
async function connectSync(){ const t=($('#tokenIn').value||'').trim(); if(!t){toast('請貼上 token');return;} SY={token:t}; saveSY(); render(); await syncNow(true); render(); }
async function disconnectSync(){ if(!(await ask('喺呢部機中斷同步？資料會保留喺呢部機同 GitHub，之後可以再連接。','中斷'))) return; SY={}; saveSY(); setSyncStatus(''); render(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ tickTimer(); syncNow(false); wakeLock=null; lastTouch=Date.now(); keepAwake(wakeWanted()); } });
/* 訓練中保持螢幕唔熄（iOS 16.4+） */
let wakeLock=null, wakeWant=false, wakeReq=null, lastTouch=Date.now();
function wakeWanted(){ if(!P.wake||!W||!(V.view==='prep'||V.view==='workout'||V.view==='break'||V.view==='extras')) return false;
  if(P.wakeIdle>0&&Date.now()-lastTouch>P.wakeIdle*60000) return false; return true; }
document.addEventListener('pointerdown',()=>{ const was=wakeWanted(); lastTouch=Date.now(); if(!was&&wakeWanted()) keepAwake(true); },{passive:true});
setInterval(()=>{ if(wakeLock&&!wakeWanted()) keepAwake(false); },15000);
async function keepAwake(on){
  wakeWant=on;
  try{
    if(on){
      if(wakeLock||wakeReq||!navigator.wakeLock||document.visibilityState!=='visible') return;
      wakeReq=navigator.wakeLock.request('screen');
      const l=await wakeReq; wakeReq=null; wakeLock=l;
      l.addEventListener('release',()=>{ if(wakeLock===l) wakeLock=null; });
      if(!wakeWant){ wakeLock=null; await l.release(); }
    } else if(wakeLock){ const l=wakeLock; wakeLock=null; await l.release(); }
  }catch(e){ wakeReq=null; }
}
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
let _rz=null; window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(V.view==='progress'&&V.exId&&!drag)render();},200);});
/* 離線：喺 gym 冇網都開到 */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
window.addEventListener('online',()=>syncNow(false));

render();
syncNow(false);
restoreSY();
</script>
